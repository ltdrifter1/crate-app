<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none" role="img" aria-label="Planet MP3">
  <title>Planet MP3</title>
  <defs>
    <radialGradient id="planetBody" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#3A3A3E"/>
      <stop offset="42%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="planetRim" x1="18%" y1="12%" x2="78%" y2="88%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="28%" stop-color="#D8D8DC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wordFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F2F3F5"/>
      <stop offset="100%" stop-color="#9A9EA6"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ring (behind planet on upper-right) -->
  <g transform="translate(512 470) rotate(-28)">
    <ellipse cx="0" cy="0" rx="340" ry="92" stroke="#F2F3F5" stroke-width="5" opacity="0.22"/>
  </g>

  <!-- Planet -->
  <circle cx="512" cy="470" r="248" fill="url(#planetBody)"/>
  <circle cx="512" cy="470" r="248" fill="url(#planetRim)" opacity="0.85"/>
  <!-- Crescent highlight along upper-left limb -->
  <path
    d="M330 350c42-78 128-128 222-128 18 0 36 2 52 6-78 18-140 78-168 156-18 48-20 96-8 140-54-28-90-86-98-174z"
    fill="#FFFFFF"
    opacity="0.18"
  />
  <path
    d="M318 318c28-48 78-86 138-102 8 2 14 4 22 6-62 22-110 72-132 132-12 34-14 68-8 100-36-24-56-66-20-136z"
    fill="#FFFFFF"
    opacity="0.55"
  />

  <!-- Ring front arc (passes in front of lower-left planet, behind wordmark via opacity layering) -->
  <g transform="translate(512 470) rotate(-28)">
    <path
      d="M-330 0 A340 92 0 0 0 330 0"
      stroke="#F2F3F5"
      stroke-width="5.5"
      opacity="0.9"
      stroke-linecap="round"
    />
  </g>

  <!-- Dot trail -->
  <g fill="#F2F3F5">
    <circle cx="118" cy="468" r="7.5" opacity="0.95"/>
    <circle cx="148" cy="468" r="6.5" opacity="0.88"/>
    <circle cx="176" cy="468" r="5.6" opacity="0.8"/>
    <circle cx="202" cy="468" r="4.8" opacity="0.72"/>
    <circle cx="226" cy="468" r="4" opacity="0.62"/>
    <circle cx="248" cy="468" r="3.3" opacity="0.52"/>
    <circle cx="268" cy="468" r="2.6" opacity="0.42"/>
    <circle cx="286" cy="468" r="2" opacity="0.32"/>
  </g>

  <!-- Wordmark -->
  <g filter="url(#softGlow)">
    <text
      x="512"
      y="500"
      text-anchor="middle"
      font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="148"
      font-weight="800"
      font-style="italic"
      letter-spacing="-6"
      fill="url(#wordFill)"
    >PLANET</text>
    <text
      x="678"
      y="568"
      text-anchor="middle"
      font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="64"
      font-weight="800"
      font-style="italic"
      letter-spacing="2"
      fill="url(#wordFill)"
    >MP3</text>
  </g>
</svg>
