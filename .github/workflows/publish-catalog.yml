# Publish catalog/v1.json + catalog/homeLite (npm run catalog:publish) from CI,
# so first visits load the whole crate in one download without anyone running
# the script by hand. Nightly, plus on demand from the Actions tab.
#
# Needs one repository secret: FIREBASE_SERVICE_ACCOUNT — the full JSON of a
# service-account key (Firebase Console → Project Settings → Service Accounts →
# Generate new private key). Settings → Secrets and variables → Actions.
name: Publish catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC

permissions:
  contents: read

concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for the service-account secret
        id: key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # Not set up yet: skip quietly rather than fail (and email) every night.
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set; skipping the nightly publish."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22 # .nvmrc quotes its value, which setup-node may not parse
          cache: npm

      - run: npm ci --no-audit --no-fund
        if: steps.key.outputs.present == 'true'

      - name: Publish
        if: steps.key.outputs.present == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json
          npm run catalog:publish

      - name: Remove the key file
        if: always()
        run: rm -f serviceAccountKey.json
